<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Setting up your account — Invoice &amp; Estimate Builder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="screen">
  <div class="center-screen">
    <div class="brand">
      <div class="brand-mark">🧾</div>
      <div class="brand-name">Invoicing</div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="card-title">You're all set!</div>
      <div class="card-sub">Your card is on file. Head back in to keep creating and sending invoices.</div>
      <button class="btn btn-primary" id="continueBtn" style="margin-top:8px;">Continue to Invoicing</button>
    </div>
  </div>
</div>

<script type="module">
import { auth } from './js/firebase.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'login.html'; }
});

document.getElementById('continueBtn').addEventListener('click', () => {
  window.location.href = 'app.html';
});
</script>

</body>
</html>
